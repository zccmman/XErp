[project]
name = "xerp"
version = "0.1.0"
description = "XErp — AI Native 智能体 ERP 内核（总账优先，确定性内核 + 概率性外壳）"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
